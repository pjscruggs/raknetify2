/** Tests compiler diagnostics against both ordinary Java and Mixin-generated method bodies. */
plugins { id 'java-library' }

group = 'com.ishland.raknetify.build'
version = '1.0'

repositories { mavenCentral() }

dependencies {
    compileOnly 'com.google.errorprone:error_prone_core:2.52.0'
    testImplementation 'com.google.errorprone:error_prone_core:2.52.0'
    testImplementation 'com.google.errorprone:error_prone_test_helpers:2.52.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.14.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.addAll(['-Xlint:all', '-Werror',
            '--add-exports=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED',
            '--add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED',
            '--add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED'])
}

test {
    useJUnitPlatform()
    ['api', 'file', 'code', 'comp', 'main', 'model', 'parser', 'processing', 'tree', 'util'].each {
        jvmArgs "--add-exports=jdk.compiler/com.sun.tools.javac.${it}=ALL-UNNAMED"
    }
    jvmArgs '--add-opens=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED',
            '--add-opens=jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED'
}
