/** Builds platform-independent framing, compression, synchronization, and diagnostic code. */
configurations { pitestRuntime }

repositories { maven { url = 'https://maven.fabricmc.net/' } }

dependencies {
    pitestRuntime 'org.pitest:pitest-command-line:1.30.2'
    pitestRuntime 'org.pitest:pitest-junit5-plugin:1.2.3'
    testImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    compileOnlyApi 'de.maxhenkel.voicechat:voicechat-api:2.2.39'
    testImplementation 'de.maxhenkel.voicechat:voicechat-api:2.2.39'
    api("com.github.RelativityMC.netty-raknet:netty-raknet-common") {
        transitive = false
    }
    api("com.github.RelativityMC.netty-raknet:netty-raknet-client")
    api("com.github.RelativityMC.netty-raknet:netty-raknet-server")
    api("org.apache.commons:commons-math3:3.6.1")

    compileOnly("io.netty:netty-all:${project.netty_version}")

    compileOnly("com.google.code.gson:gson:2.9.0")
    compileOnly("com.google.guava:guava:${project.guava_version}")

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.3'
    testImplementation 'com.tngtech.archunit:archunit:1.5.1'
    testImplementation "io.netty:netty-all:${project.netty_version}"
    testImplementation "com.google.guava:guava:${project.guava_version}"
    testRuntimeOnly 'com.google.code.gson:gson:2.9.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Standalone servers use the same locale inventory validated by CI.
processResources {
    from(rootProject.file('.github/scripts/minecraft-locales.json')) { into 'assets/raknetify' }
}

test { useJUnitPlatform() }

/** Mutates replay decisions and budget accounting to verify the security regressions detect faults. */
tasks.register('pitest', JavaExec) {
    // The released Gradle PIT plugin uses Configuration.setVisible, deprecated in Gradle 9.9.
    // Invoke the same PIT engine directly so strict Gradle warning checks remain enabled.
    group = 'verification'
    description = 'Mutation-test replay protection with full line coverage and a 95 percent mutation threshold.'
    dependsOn testClasses
    classpath = configurations.pitestRuntime + sourceSets.test.runtimeClasspath
    mainClass = 'org.pitest.mutationtest.commandline.MutationCoverageReport'
    args '--targetClasses', 'com.ishland.raknetify.common.connection.FrameReplayWindow*',
            '--targetTests', 'com.ishland.raknetify.common.connection.FrameReplayWindowTest,' +
                    'com.ishland.raknetify.common.connection.AuthenticatedFrameCipherTest',
            '--threads', '2', '--outputFormats', 'XML,HTML', '--timestampedReports', 'false',
            '--failWhenNoMutations', 'true', '--coverageThreshold', '100', '--mutationThreshold', '95'
    doFirst {
        args '--reportDir', layout.buildDirectory.dir('reports/pitest').get().asFile.absolutePath,
                '--sourceDirs', sourceSets.main.allSource.srcDirs.collect { it.absolutePath }.join(','),
                '--mutableCodePaths', sourceSets.main.output.classesDirs.files.collect { it.absolutePath }.join(',')
    }
}

/** Runs native login packet serialization before the client starts graphics or opens an account. */
tasks.register('nativeLoginProbe', Jar) {
    dependsOn testClasses
    archiveFileName = 'native-login-test.jar'
    from(sourceSets.main.output)
    from(sourceSets.test.output) {
        include 'com/ishland/raknetify/common/connection/RaknetEncryptionProbe*'
        include 'com/ishland/raknetify/common/connection/RaknetStatusProbe*'
        include 'com/ishland/raknetify/test/NativeLogin*'
        include 'com/ishland/raknetify/test/ChannelSetup*'
        include 'com/ishland/raknetify/test/TransportTestPayload*'
    }
    from('src/test/fixtures/native-login')
}

tasks.register('transportProbe', Sync) {
    dependsOn testClasses, nativeLoginProbe
    into layout.buildDirectory.dir('transport-probe')
    from(sourceSets.test.output) { into 'classes' }
    from(sourceSets.main.output) { into 'classes' }
    from(configurations.testRuntimeClasspath.filter { it.name.endsWith('.jar') }) { into 'lib' }
    from(tasks.named('nativeLoginProbe'))
}

// Share bounded payload witnesses with the isolated native test mods.
sourceSets.test.java.srcDir rootProject.file('transport-tests/shared')

sourceSets {
    benchmark {
        compileClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
        runtimeClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
    }
}

dependencies {
    benchmarkImplementation 'org.openjdk.jmh:jmh-core:1.37'
    benchmarkAnnotationProcessor 'org.openjdk.jmh:jmh-generator-annprocess:1.37'
}

tasks.register('benchmark', JavaExec) {
    group = 'verification'
    description = 'Measure transport operations with independent JVM forks and allocation profiling.'
    dependsOn benchmarkClasses
    classpath = sourceSets.benchmark.runtimeClasspath
    mainClass = 'org.openjdk.jmh.Main'
    doFirst { layout.buildDirectory.dir('reports').get().asFile.mkdirs() }
    args '-foe', 'true', '-f', '3', '-wi', '3', '-i', '5', '-w', '1s', '-r', '1s', '-prof', 'gc',
            '-jvmArgsAppend', '-Xms256m -Xmx256m', '-rf', 'json',
            '-rff', layout.buildDirectory.file('reports/benchmark.json').get().asFile.absolutePath
}

// The JMH generator owns its harness sources. Handwritten benchmark sources remain fully checked.
tasks.named('compileBenchmarkJava', JavaCompile) {
    options.errorprone.excludedPaths = '.*/generated/sources/annotationProcessor/java/benchmark/.*'
}
