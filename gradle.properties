# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true

# Fabric Properties
# check these on https://fabricmc.net/develop
#
# Also don't forget to gen mappings in genMappings.sh
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.1
modern_minecraft_version=26.3
loader_version=0.19.5

# Mod Properties
mod_version = 0.1.0-beta.1
# Keep build numbering stable when new release tags are added.
version_base_tag = 0.1.0+alpha.5
maven_group = io.github.pjscruggs.raknetify2
archives_base_name = raknetify2

# Optional destination for independently configured proxy plugin builds.
# modrinth_project_id =

# Dependencies
#fabric_version=0.44.0+1.18
#mixinextras_version=0.1.1

# Forge discovers one development module containing both compiled classes and metadata.
net.minecraftforge.gradle.merge-source-sets=true
