/** Packages the shared modern Minecraft transport with native NeoForge loader entrypoints. */
apply plugin: 'net.neoforged.moddev'
apply plugin: 'com.gradleup.shadow'

base { archivesName = project.archives_base_name + '-neoforge-mc1.21.1' }
def supported = rootProject.nativeLoaders['neoforge-mc1.21.1']

java.toolchain.languageVersion = JavaLanguageVersion.of(21)
java.sourceCompatibility = JavaVersion.VERSION_21
java.targetCompatibility = JavaVersion.VERSION_21

neoForge {
    enable {
        version = supported.version
        disableRecompilation = true
    }
    validateAccessTransformers = true
    runs {
        server {
            server()
            programArgument '--nogui'
            gameDirectory = layout.buildDirectory.dir('run/server')
        }
        client {
            client()
            gameDirectory = layout.buildDirectory.dir('run/client')
        }
    }
    mods {
        raknetify { sourceSet sourceSets.main }
    }
}

sourceSets.main.java.srcDir rootProject.file('native-legacy/src/main/java')
configurations { shadowInclude }
dependencies {
    shadowInclude implementation(project(':common')) { exclude group: 'it.unimi.dsi', module: 'fastutil' }
    constraints {
        // These tools prepare game classes during the build and are not Minecraft runtime libraries.
        neoFormRuntimeExternalTools('org.apache.commons:commons-compress:1.28.0') {
            because 'Patch malformed archive handling in the build-time patch tool.'
        }
        neoFormRuntimeExternalTools('org.apache.commons:commons-lang3:3.20.0') {
            because 'Bound recursive class-name parsing in the build-time patch tool.'
        }
    }
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft', supported.minecraft
    inputs.property 'neoforge', supported.version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: inputs.properties.version, minecraft: inputs.properties.minecraft, neoforge: inputs.properties.neoforge
    }
    from rootProject.file('icon.png')
}

shadowJar {
    configurations = [project.configurations.shadowInclude]
    archiveClassifier = ''
    // Minecraft supplies FastUtil. Bundling it would create duplicate packages in the loader's module layer.
    dependencies { exclude(dependency('it.unimi.dsi:fastutil')) }
    from rootProject.file('LICENSE')
    from(rootProject.file('netty-raknet/LICENSE')) { into 'META-INF/licenses/netty-raknet' }
    mergeServiceFiles()
}

jar { archiveClassifier = 'dev' }
assemble.dependsOn shadowJar

sourceSets {
    transportTest {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}
tasks.register('transportTestJar', Jar) {
    archiveClassifier = 'transport-test'
    from sourceSets.transportTest.output
}
assemble.dependsOn transportTestJar
