/** Configures shared dependencies, publication settings, and verification for every mod and proxy module. */
buildscript {
	repositories { mavenCentral() }
	dependencies {
		// Patch plugin dependencies independently of libraries supplied by Minecraft at runtime.
		classpath platform('com.fasterxml.jackson:jackson-bom:2.22.3')
		classpath platform('org.apache.logging.log4j:log4j-bom:2.25.5')
		constraints {
			classpath('com.google.guava:guava:33.7.2-jre') {
				because 'CVE-2026-102554 fixes unbounded allocation during deserialization.'
			}
			classpath('org.codehaus.plexus:plexus-utils:4.0.3') {
				because 'CVE-2025-67030 fixes archive extraction outside the destination.'
			}
		}
	}
}

plugins {
	id 'net.ltgt.errorprone' version '5.2.0' apply false
	id 'org.cyclonedx.bom' version '3.6.0'
	id 'fabric-loom' version '1.19.4' apply false
	id 'net.fabricmc.fabric-loom' version '1.19.4' apply false
	id 'com.gradleup.shadow' version '9.6.1' apply false
	id 'net.neoforged.moddev' version '2.0.148' apply false
	id 'net.minecraftforge.gradle' version '7.0.17' apply false
	id 'dev.yumi.gradle.licenser' version '4.0.0' apply false
	id 'com.modrinth.minotaur' version '2.10.0' apply false
}

ext.remapJarTaskType = net.fabricmc.loom.task.RemapJarTask
ext.modrinthProjectId = providers.gradleProperty('modrinth_project_id')
ext.supportedVersions = new groovy.json.JsonSlurper().parse(file('supported-versions.json'))
ext.nativeLoaders = new groovy.json.JsonSlurper().parse(file('native-loaders.json'))

allprojects {
	tasks.named('cyclonedxDirectBom') {
		// These are the dependencies actually copied into the released JARs.
		includeConfigs = ['shadowInclude']
		jsonOutput = layout.buildDirectory.file('reports/sbom/direct-bom.json')
		if (project.name.startsWith('transport-test-')) enabled = false
	}
}

tasks.named('cyclonedxBom') {
	jsonOutput = layout.buildDirectory.file('reports/sbom/bom.json')
}

tasks.register('qualityChecks') {
	group = 'verification'
	description = 'Check documentation and a cyclomatic complexity limit of ten across project sources.'
	dependsOn gradle.includedBuild('quality').task(':check')
    dependsOn gradle.includedBuild('compiler-checks').task(':test')
    dependsOn gradle.includedBuild('netty-raknet').task(':netty-raknet-common:test')
    dependsOn gradle.includedBuild('netty-raknet').task(':netty-raknet-tests:test')
}

subprojects {
	apply plugin: 'java'
	apply plugin: 'java-library'
    // DNS service discovery is per RakNet connection. Keep Java's system resolver in charge.
    plugins.withId('com.gradleup.shadow') {
        tasks.named('shadowJar') {
            exclude 'META-INF/services/java.net.spi.InetAddressResolverProvider'
            exclude 'META-INF/services/sun.net.spi.nameservice.NameServiceDescriptor'
            relocate 'org.xbill.DNS', 'com.ishland.raknetify.internal.dns'
        }
    }
	apply plugin: 'net.ltgt.errorprone'
	dependencies {
		errorprone 'com.google.errorprone:error_prone_core:2.52.0'
        errorprone 'com.ishland.raknetify.build:compiler-checks:1.0'
        compileOnly 'com.google.errorprone:error_prone_annotations:2.52.0'
        testCompileOnly 'com.google.errorprone:error_prone_annotations:2.52.0'
		errorprone 'com.uber.nullaway:nullaway:0.14.3'
		compileOnly 'org.jspecify:jspecify:1.0.1'
		testCompileOnly 'org.jspecify:jspecify:1.0.1'
	}
	tasks.withType(JavaCompile).configureEach {
		options.compilerArgs.addAll(['-Xlint:rawtypes,unchecked', '-Werror'])
		options.errorprone {
			ignoreSuppressionAnnotations = true
            // Retains the original check for ordinary methods while recognizing generated invoker bodies.
            disable 'DoNotCallSuggester'
            error 'MixinAwareDoNotCall'
			error 'NullAway', 'CheckReturnValue', 'CollectionIncompatibleType', 'EqualsHashCode',
					'BoxedPrimitiveEquality', 'MustBeClosedChecker', 'StreamResourceLeak',
					'FutureReturnValueIgnored', 'InterruptedExceptionSwallowed', 'GuardedBy'
			option 'NullAway:AnnotatedPackages', 'com.ishland.raknetify'
            // JMH invokes Setup before measured methods, which must still pass field-initialization checks.
            option 'NullAway:CustomInitializerAnnotations', 'org.openjdk.jmh.annotations.Setup'
            // Mixin invokes these methods after bytecode transformation, outside the Java call graph.
            option 'UnusedMethod:ExemptingMethodAnnotations',
                    'org.spongepowered.asm.mixin.injection.Inject,org.spongepowered.asm.mixin.injection.Redirect,' +
                    'org.spongepowered.asm.mixin.injection.ModifyArg,org.spongepowered.asm.mixin.injection.ModifyArgs,' +
                    'org.spongepowered.asm.mixin.injection.ModifyVariable,org.spongepowered.asm.mixin.injection.ModifyConstant,' +
                    'org.spongepowered.asm.mixin.injection.Surrogate,' +
                    'com.llamalad7.mixinextras.injector.ModifyExpressionValue,com.llamalad7.mixinextras.injector.wrapoperation.WrapOperation,' +
                    'com.llamalad7.mixinextras.injector.WrapWithCondition,com.llamalad7.mixinextras.injector.v2.WrapWithCondition,' +
                    'com.llamalad7.mixinextras.injector.wrapmethod.WrapMethod,com.llamalad7.mixinextras.injector.ModifyReturnValue'
            // Shadow fields are supplied by the target class, whose constructor the mixin does not own.
            option 'NullAway:ExcludedFieldAnnotations', 'org.spongepowered.asm.mixin.Shadow'
            option 'Unused:methodAnnotationsExemptingParameters',
                    'org.spongepowered.asm.mixin.injection.Inject,org.spongepowered.asm.mixin.injection.Redirect,' +
                    'org.spongepowered.asm.mixin.injection.ModifyArg,org.spongepowered.asm.mixin.injection.ModifyArgs,' +
                    'org.spongepowered.asm.mixin.injection.ModifyVariable,org.spongepowered.asm.mixin.injection.ModifyConstant,' +
                    'org.spongepowered.asm.mixin.injection.Surrogate,' +
                    'com.llamalad7.mixinextras.injector.ModifyExpressionValue,com.llamalad7.mixinextras.injector.wrapoperation.WrapOperation,' +
                    'com.llamalad7.mixinextras.injector.WrapWithCondition,com.llamalad7.mixinextras.injector.v2.WrapWithCondition,' +
                    'com.llamalad7.mixinextras.injector.wrapmethod.WrapMethod,com.llamalad7.mixinextras.injector.ModifyReturnValue'


		}
	}
	// Integration fixtures must never become Maven release artifacts.
	if (!project.name.startsWith('transport-test-')) apply plugin: 'maven-publish'
	apply plugin: 'dev.yumi.gradle.licenser'
	tasks.named('check') { dependsOn rootProject.tasks.named('qualityChecks') }

	java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

	version = project.mod_version + "." + rootProject.getVersionSuffix()
	if (project.name == 'fabric') version += '.legacy'
	if (project.name == 'fabric-26') version += '.modern'

	license {
		include '**/*.java'
		rule(rootProject.file('HEADER.txt'))
	}

	repositories {
		mavenCentral()
		maven { url = 'https://maven.maxhenkel.de/repository/public' }
		maven { url = 'https://jitpack.io' }
		maven { url = 'https://repo.codemc.org/repository/maven-public' }
		maven { url = 'https://oss.sonatype.org/content/repositories/snapshots' }
	}

	plugins.withId('maven-publish') {
		// configure the maven publication
		publishing {
			publications {
				mavenJava(MavenPublication) {
					from components.java
				}
			}

			// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
			repositories {
				// Add repositories to publish to here.
				// Notice: This block does NOT have the same function as the block in the top level.
				// The repositories here will be used for publishing your artifact, not for
				// retrieving dependencies.
			}
		}
	}

	tasks.withType(AbstractArchiveTask) {
		preserveFileTimestamps = false
		reproducibleFileOrder = true
	}

	afterEvaluate {
		if (it.plugins.hasPlugin("com.modrinth.minotaur")) {
			modrinth {
				token = System.getenv("MODRINTH_TOKEN") // This is the default. Remember to have the MODRINTH_TOKEN environment variable set or else this will fail, or set it to whatever you want - just make sure it stays private!
				projectId = rootProject.modrinthProjectId.get()
//				versionNumber = project.version + "+" + project.minecraft_version // You don't need to set this manually. Will fail if Modrinth has this version already
//				versionName = project.version + " devbuild for " + project.minecraft_version
				versionType = "beta"
//				uploadFile = remapShadowJar // With Loom, this MUST be set to `remapJar` instead of `jar`!
				gameVersions = rootProject.supportedVersions.values().collectMany { it.gameVersions }.unique()
//				loaders = ["fabric"]
				changelog = com.ishland.buildscript.ParseGItHubActionChangelog.getChangelog()
			}
		}
	}

}

afterEvaluate {
	logger.lifecycle("Version String: ${project.mod_version + '.' + getVersionSuffix()}")
	logger.lifecycle(com.ishland.buildscript.ParseGItHubActionChangelog.getChangelog())
}

/**
 * Counts commits after the fixed version anchor so publishing a release tag cannot reset build numbering.
 *
 * @return commit distance from the configured anchor, followed by a dirty marker when needed
 */
String getVersionSuffix() {
    def stdout = providers.exec {
        commandLine 'git', 'describe', '--tags', '--match', project.version_base_tag, '--dirty', '--broken'
    }.standardOutput.asText.get()
	stdout = stdout.toString().strip()
	def suffix = ""
	if (stdout.endsWith("-dirty")) {
		stdout = stdout.substring(0, stdout.length() - "-dirty".length())
		suffix = "-dirty"
	}
	if (stdout.indexOf('-') < 0) {
		return "0" + suffix;
	}
	def split = stdout.split('-')
	return split[split.length - 2] + suffix
}
