/** Builds and remaps the legacy Fabric runtime embedded in the universal distribution. */
evaluationDependsOn(":")

apply plugin: 'fabric-loom'
apply plugin: 'com.gradleup.shadow'

def fabricSources = rootProject.file('fabric/src/main')

sourceSets.main {
	java.setSrcDirs([new File(fabricSources, 'java')])
	resources.setSrcDirs([new File(fabricSources, 'resources')])
}

base {
    archivesName = project.archives_base_name + "-fabric"
}
group = project.maven_group + ".fabric"

configurations {
	shadowInclude
}

repositories {
	maven { url = 'https://repo.codemc.io/repository/relativitymc/' }
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	shadowInclude implementation(project(":common"))

	// Fabric API. This is technically optional, but you probably want it anyway.
//	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

def supported = rootProject.supportedVersions.legacy

processResources {
	inputs.property "version", project.version
	inputs.property "minecraft", groovy.json.JsonOutput.toJson(supported.minecraft)
	inputs.property "java", supported.java
	inputs.property "loader", supported.fabricloader

	filesMatching("fabric.mod.json") {
		// Replace the quoted placeholder with a JSON string or array before expanding the other values.
		filter { line -> line.replace('"${minecraft}"', inputs.properties.minecraft) }
		expand "version": inputs.properties.version,
				"java": inputs.properties.java,
				"loader": inputs.properties.loader
	}
}

def packetNames = tasks.register('generatePacketNames') {
	def packetSource = new File(fabricSources, 'java/com/ishland/raknetify/fabric/common/connection/RakNetMultiChannel.java')
	def output = layout.buildDirectory.file('generated/packetNames/raknetify-packet-names.properties')
	inputs.file(packetSource)
	inputs.file(provider { loom.mappingConfiguration.tinyMappings.toFile() })
	outputs.file(output)
	doLast {
		def classes = (packetSource.text =~ 'net/minecraft/class_[0-9_]+(?:\\$class_[0-9_]+)*').collect().toSet()
		def names = new TreeMap<String, Set<String>>()
		def mappingFiles = [loom.mappingConfiguration.tinyMappings.toFile()]
		mappingFiles.each { mappingFile ->
			mappingFile.eachLine('UTF-8') { line ->
				def fields = line.split('\t')
				if (fields[0] == 'c' && classes.contains(fields[2])) {
					def key = fields[2].replace('/', '.')
					if (!names.containsKey(key)) names[key] = new TreeSet<String>()
					names[key].add(fields[1].replace('/', '.'))
				}
			}
		}
		output.get().asFile.with { parentFile.mkdirs() }
		output.get().asFile.setText(names.collect { key, value -> "$key=${value.join(',')}\n" }.join(), 'UTF-8')
	}
}

processResources {
	from(packetNames)
}

tasks.withType(JavaCompile).configureEach {
	// Minecraft 1.18 (1.18-pre2) upwards uses Java 17.
	it.options.release = 17
	// A missing Mixin mapping must fail compilation instead of disappearing among CI annotations.
	it.options.compilerArgs.add("-Werror")
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()
}

loom {
	accessWidenerPath = new File(fabricSources, 'resources/raknetify-fabric.accesswidener')
	runs {
		server {
			vmArgs "-Draknetify.debug=true", "-Dio.netty.leakDetection.level=advanced"
			ideConfigGenerated(true)
		}
		client {
			vmArgs "-Draknetify.debug=true", "-Dio.netty.leakDetection.level=advanced"
			ideConfigGenerated(true)
		}
	}
    mixin {
        useLegacyMixinAp = true
    }
}

jar {
	exclude "META-INF/LICENSE.txt"
	exclude "META-INF/NOTICE.txt"
	from "../LICENSE"
}

shadowJar {
	dependencies {
		exclude(dependency('it.unimi.dsi:fastutil'))
	}
	exclude "META-INF/LICENSE.txt"
	exclude "META-INF/NOTICE.txt"
	// Optional mod entrypoints are discovered from metadata rather than Java call sites.
	minimize { exclude(project(':common')) }
	archiveClassifier = "all-dev"
	configurations = [ project.configurations.shadowInclude ]
	from "../LICENSE"
}

//noinspection UnnecessaryQualifiedReference
task("remapShadowJar", type: rootProject.remapJarTaskType, dependsOn: shadowJar) {
	input = shadowJar.archiveFile
	archiveFileName = shadowJar.archiveFileName.get().replaceAll("-dev\\.jar\$", ".jar")
	addNestedDependencies = true
}

assemble.dependsOn(remapShadowJar)

afterEvaluate {
	migrateMappings.configure {
		outputDir = project.file("build/remappedSrc")
		doLast {
			copy {
				from project.file("build/remappedSrc")
				into project.file("src/main/java")
			}
		}
	}
}

tasks.withType(AbstractArchiveTask) {
	preserveFileTimestamps = false
	reproducibleFileOrder = true
}

// Exercise shared capture behavior against each runtime's actual implementation.
sourceSets.test.java.srcDir rootProject.file('transport-tests/packet-capture')
dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.14.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
test {
    useJUnitPlatform()
    workingDir = layout.buildDirectory.dir('test-runtime').get().asFile
    doFirst { workingDir.mkdirs() }
}
