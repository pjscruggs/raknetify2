/** Builds the Java 17 endpoint against the Forge 47 game and loader APIs. */
plugins { id 'net.minecraftforge.renamer' version '1.1.2' }

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'com.gradleup.shadow'

base { archivesName = project.archives_base_name + '-forge-mc1.20.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
tasks.withType(JavaCompile).configureEach { options.release = 17 }

minecraft {
    // The packaged mixins select named or SRG handlers at runtime, so keep both sets of names.
    mappings channel: 'official', version: '1.20.1'
    runs {
        register('server') { args '--nogui' }
        register('client')
    }
}
repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
}
sourceSets.main.java.srcDir rootProject.file('native-legacy/src/main/java')
configurations { shadowInclude }
dependencies {
    implementation minecraft.dependency('net.minecraftforge:forge:' + rootProject.nativeLoaders['forge-mc1.20.1'].version)
    shadowInclude implementation(project(':common'))
}
processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') { expand version: inputs.properties.version }
    from rootProject.file('icon.png')
}
jar { archiveClassifier = 'dev' }
shadowJar {
    configurations = [project.configurations.shadowInclude]
    destinationDirectory = layout.buildDirectory.dir('unmapped')
    archiveClassifier = ''
    manifest { attributes 'MixinConfigs': 'raknetify-forge47.mixins.json,raknetify-forge47-palettes.mixins.json' }
    dependencies { exclude(dependency('it.unimi.dsi:fastutil')) }
    from rootProject.file('LICENSE')
    from(rootProject.file('netty-raknet/LICENSE')) { into 'META-INF/licenses/netty-raknet' }
    filesMatching('META-INF/services/**') { duplicatesStrategy = DuplicatesStrategy.INCLUDE }
    mergeServiceFiles()
}

// Forge 47 links Minecraft members by SRG name in installed games.
renamer.mappings.from minecraft.dependency.toSrgFile
renamer.classes(tasks.named('shadowJar', Jar)) {
    archiveClassifier = ''
    output = layout.buildDirectory.file("libs/${base.archivesName.get()}-${version}.jar")
}

sourceSets {
    transportTest {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}
tasks.register('transportTestJar', Jar) {
    archiveClassifier = 'transport-test'
    destinationDirectory = layout.buildDirectory.dir('unmapped')
    manifest { attributes 'MixinConfigs': 'transport-test-forge47.mixins.json' }
    from sourceSets.transportTest.output
    from('src/main/resources/pack.mcmeta')
}
renamer.classes(tasks.named('transportTestJar', Jar)) {
    archiveClassifier = 'transport-test'
    output = layout.buildDirectory.file("libs/${base.archivesName.get()}-${version}-transport-test.jar")
}
