/** Builds the unobfuscated modern Fabric runtime embedded in the universal distribution. */
apply plugin: 'net.fabricmc.fabric-loom'
apply plugin: 'com.gradleup.shadow'

base {
    archivesName = project.archives_base_name + '-fabric-26'
}

group = project.maven_group + ".fabric"

sourceSets.main.java.srcDir 'src/loader/java'
sourceSets.main.resources.srcDir 'src/loader/resources'

configurations {
    shadowInclude
}

dependencies {
    minecraft "com.mojang:minecraft:${project.modern_minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    shadowInclude implementation(project(':common'))
}

def supported = rootProject.supportedVersions.modern

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft', groovy.json.JsonOutput.toJson(supported.minecraft)
    inputs.property 'java', supported.java
    inputs.property 'loader', supported.fabricloader
    filesMatching('fabric.mod.json') {
        // Replace the quoted placeholder with a JSON string or array before expanding the other values.
        filter { line -> line.replace('"${minecraft}"', inputs.properties.minecraft) }
        expand version: inputs.properties.version,
                loader: inputs.properties.loader, java: inputs.properties.java
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

loom {
    accessWidenerPath = file('src/main/resources/raknetify-fabric.accesswidener')
}

shadowJar {
    dependencies {
        exclude(dependency('it.unimi.dsi:fastutil'))
    }
    exclude 'META-INF/LICENSE.txt', 'META-INF/NOTICE.txt'
    // Optional mod entrypoints are discovered from metadata rather than Java call sites.
    minimize { exclude(project(':common')) }
    archiveClassifier = 'all'
    configurations = [project.configurations.shadowInclude]
    from '../LICENSE'
}

assemble.dependsOn(shadowJar)

jar {
    from "../LICENSE"
}

// Exercise shared capture behavior against each runtime's actual implementation.
sourceSets.test.java.srcDir rootProject.file('transport-tests/packet-capture')
dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.14.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
test {
    useJUnitPlatform()
    workingDir = layout.buildDirectory.dir('test-runtime').get().asFile
    doFirst { workingDir.mkdirs() }
}

sourceSets {
    integrationTest {
        java.srcDir rootProject.file('transport-tests/shared')
        java.srcDir rootProject.file('transport-test-client/src/shared/java')
        java.srcDir rootProject.file('transport-test-client/src/native/java')
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
tasks.register('integrationTestJar', Jar) {
    archiveClassifier = 'integration-test'
    from sourceSets.integrationTest.output
}
assemble.dependsOn integrationTestJar
