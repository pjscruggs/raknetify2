import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import java.util.zip.ZipFile

/** Packages compatible Fabric runtimes as Loader-selected dependencies and generates download metadata. */
evaluationDependsOn(':fabric')
evaluationDependsOn(':fabric-26')

base {
    archivesName = project.archives_base_name + '-fabric'
}
group = project.maven_group + '.fabric'

def runtimes = [
        legacy: project(':fabric').tasks.named('remapShadowJar'),
        modern: project(':fabric-26').tasks.named('shadowJar')
]
def generated = layout.buildDirectory.dir('generated/metadata')

def metadata = tasks.register('generateMetadata') {
    dependsOn runtimes.values()
    inputs.files(runtimes.values().collect { it.flatMap { task -> task.archiveFile } })
    inputs.file(rootProject.file('supported-versions.json'))
    inputs.property('version', project.version)
    inputs.property('gameVersions', rootProject.supportedVersions.values().collectMany { it.gameVersions }.unique())
    outputs.dir(generated)

    doLast {
        def variants = runtimes.collect { name, task ->
            def jar = task.get().archiveFile.get().asFile
            new ZipFile(jar).withCloseable { zip ->
                def mod = zip.getInputStream(zip.getEntry('fabric.mod.json')).withCloseable { input ->
                    new JsonSlurper().parse(input)
                }
                [name: name, file: "META-INF/jars/${name}.jar", version: mod.version, depends: mod.depends]
            }
        }
        def dependencies = ['minecraft', 'java', 'fabricloader'].collectEntries { key ->
            [(key): variants.collectMany { variant ->
                def value = variant.depends[key]
                value instanceof List ? value : [value]
            }.unique()]
        }
        // The required nested dependency makes Loader select one compatible runtime instead of skipping both.
        dependencies.raknetify_runtime = variants.collect { it.version }
        def mod = [
                schemaVersion: 1, id: 'raknetify', version: inputs.properties.version.toString(),
                name: 'Raknetify2', description: 'RakNet networking for Minecraft clients and servers.',
                authors: ['ishland'], contributors: ['pjscruggs'], license: 'MIT', environment: '*',
                icon: 'icon.png',
                contact: [sources: 'https://github.com/pjscruggs/raknetify2',
                          issues: 'https://github.com/pjscruggs/raknetify2/issues'],
                jars: variants.collect { [file: it.file] }, depends: dependencies
        ]
        def compatibility = [version: inputs.properties.version.toString(),
                             gameVersions: inputs.properties.gameVersions,
                             runtimes: variants]
        def directory = generated.get().asFile
        directory.mkdirs()
        new File(directory, 'fabric.mod.json').text = JsonOutput.prettyPrint(JsonOutput.toJson(mod)) + '\n'
        new File(directory, 'compatibility.json').text = JsonOutput.prettyPrint(JsonOutput.toJson(compatibility)) + '\n'
    }
}

jar {
    dependsOn metadata
    from(generated)
    from(rootProject.file('icon.png'))
    from(rootProject.file('LICENSE'))
    runtimes.each { name, task ->
        from(task.flatMap { it.archiveFile }) {
            into 'META-INF/jars'
            rename { name + '.jar' }
        }
    }
}
