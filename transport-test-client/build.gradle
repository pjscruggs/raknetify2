/** Builds client address checks without linking them to a particular Minecraft namespace. */
repositories { maven { url = 'https://maven.fabricmc.net/' } }
sourceSets.main.java.srcDir 'src/shared/java'
dependencies { compileOnly "net.fabricmc:fabric-loader:${project.loader_version}" }
dependencies {
    compileOnly project(':common')
    compileOnly 'org.ow2.asm:asm-tree:9.11'
    compileOnly "io.netty:netty-all:${project.netty_version}"
}
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}
