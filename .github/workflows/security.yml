name: Dependency security
on:
  workflow_call:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundled-dependencies:
    name: Scan packaged dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: zulu
          java-version: 25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Inventory dependencies copied into release JARs
        run: ./gradlew cyclonedxBom --no-daemon --max-workers=2 --warning-mode fail
      - name: Install verified OSV Scanner
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/osv-scanner" https://github.com/google/osv-scanner/releases/download/v2.7.1/osv-scanner_linux_amd64
          echo "fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8  $RUNNER_TEMP/osv-scanner" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/osv-scanner"
      - name: Reject known vulnerabilities in packaged dependencies
        run: >-
          "$RUNNER_TEMP/osv-scanner" scan source --no-ignore --all-vulns --all-packages
          --format json --output-file build/reports/vulnerabilities.json build/reports/sbom
      - name: Preserve dependency inventory and scan results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Dependency-security
          path: |
            build/reports/sbom/
            build/reports/vulnerabilities.json
          if-no-files-found: error

  dependency-review:
    name: Review dependency changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          comment-summary-in-pr: never
