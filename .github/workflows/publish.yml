name: Publish verified build
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful build workflow run ID
        required: true
        type: string
      loader:
        description: Mod loader or server plugin to publish
        type: choice
        default: all-mods
        options: [all-mods, all-platforms, fabric, forge, neoforge, spigot]
      destination:
        description: Publication destination
        type: choice
        default: both
        options: [both, modrinth, curseforge]
      changelog:
        description: Release notes
        required: true
        type: string
      dry_run:
        description: Preview without uploading
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-raknetify2
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main' && github.repository == 'pjscruggs/raknetify2'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      revision: ${{ steps.plan.outputs.revision }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Require a successful trusted build
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.run_id }}
          LOADER: ${{ inputs.loader }}
          DESTINATION: ${{ inputs.destination }}
        run: python .github/scripts/release-plan.py --run-id "$BUILD_RUN" --loader "$LOADER" --destination "$DESTINATION"

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.verify.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.revision }}
          path: tested-source
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Artifacts
          path: release-input
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Verify release bytes and embedded versions
        run: python .github/scripts/release-plan.py --artifacts release-input
      - name: Save the supplied release notes
        env:
          RELEASE_NOTES: ${{ inputs.changelog }}
        run: python -c 'import os,pathlib; pathlib.Path("release-notes.txt").write_text(os.environ["RELEASE_NOTES"], encoding="utf-8")'
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: zulu
          java-version: 25
      - name: Verify the CurseForge upload contract without credentials
        if: matrix.destination == 'curseforge'
        env:
          LOADER: ${{ matrix.loader }}
        run: python .github/scripts/test-curseforge-publisher.py --artifacts release-input --source tested-source --loader "$LOADER"
      - name: Publish the tested JAR
        if: matrix.loader != 'spigot' || matrix.destination != 'curseforge'
        env:
          MODRINTH_TOKEN: ${{ matrix.destination == 'modrinth' && secrets.MODRINTH_TOKEN || '' }}
          CURSEFORGE_TOKEN: ${{ matrix.destination == 'curseforge' && secrets.CURSEFORGE_TOKEN || '' }}
          LOADER: ${{ matrix.loader }}
          DESTINATION: ${{ matrix.destination }}
          PREVIEW: ${{ inputs.dry_run }}
        run: >-
          ./gradlew -p .github/publish publishMods --no-daemon --max-workers=2
          "-PreleaseDirectory=$GITHUB_WORKSPACE/release-input"
          "-PchangelogFile=$GITHUB_WORKSPACE/release-notes.txt"
          "-PnativeManifest=$GITHUB_WORKSPACE/tested-source/native-loaders.json"
          "-PspigotManifest=$GITHUB_WORKSPACE/tested-source/spigot-servers.json"
          "-Ploader=$LOADER" "-Pdestination=$DESTINATION" "-PpublishDryRun=$PREVIEW"
      - name: Publish the tested Bukkit plugin
        if: matrix.loader == 'spigot' && matrix.destination == 'curseforge'
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          PREVIEW: ${{ inputs.dry_run }}
        run: |
          flags=()
          if [[ "$PREVIEW" == "true" ]]; then flags+=(--dry-run); fi
          python .github/scripts/publish-bukkit.py --artifacts release-input --source tested-source \
            --notes release-notes.txt --receipt .github/publish/build/publishMods/publishCurseforge.json "${flags[@]}"
      - name: Retain host publication identifiers
        if: always() && !inputs.dry_run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publication-${{ matrix.loader }}-${{ matrix.destination }}
          path: .github/publish/build/publishMods/*.json
          if-no-files-found: ignore
