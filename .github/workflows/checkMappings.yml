name: check mappings
on: [workflow_call]

permissions:
  contents: read

jobs:
  checkMappings:
    timeout-minutes: 120
    strategy:
      matrix:
        # Use these Java versions
        java: [
          25,    # Required by Minecraft 26.x
        ]
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Test-inputs
          path: ci-input
      - name: Verify staged test inputs
        working-directory: ci-input
        run: sha256sum --check --quiet test-inputs.sha256
      - name: setup jdk ${{ matrix.java }}
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: 'zulu'
          java-version: ${{ matrix.java }}
          java-package: jdk
      - name: "cache mappingsGen"
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ./run-mappingsGen
          key: ${{ runner.os }}-mappingsGen-${{ hashFiles('./genMappings.sh', './.github/scripts/generate-mappings.py', './supported-versions.json') }}
          restore-keys: |
            ${{ runner.os }}-mappingsGen-
      - name: generate mappings
        env:
          MAPPINGS_GEN_FRESH: true
        run: |
          version=$(jq -er .version ci-input/fabric-universal/build/generated/metadata/compatibility.json)
          ./genMappings.sh --jar "ci-input/fabric-universal/build/libs/raknetify2-fabric-${version}.jar"
      - name: fail if mappings changed
        run: |
          if ! git diff --exit-code --; then
              echo "Mappings changed, please commit them"
              git diff
              git diff --staged
              exit 1
          fi
