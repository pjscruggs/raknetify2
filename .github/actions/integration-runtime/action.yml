name: Prepare integration runtime
description: Verify the build artifacts and prepare a headless native Minecraft client
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: Test-inputs
    - shell: bash
      run: sha256sum --quiet --check test-inputs.sha256
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12'
    - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        distribution: zulu
        java-version: 25
    - shell: bash
      run: python .github/scripts/install-client-libraries.py
