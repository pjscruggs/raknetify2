import groovy.json.JsonSlurper

/** Publishes one verified loader artifact without rebuilding it or changing the project's description. */
plugins {
    id 'me.modmuss50.mod-publish-plugin' version '2.2.1'
}

def releaseDirectory = file(providers.gradleProperty('releaseDirectory').get())
def loader = providers.gradleProperty('loader').get()
def destination = providers.gradleProperty('destination').get()
validateTarget(loader, destination)
def compatibility = new JsonSlurper().parse(new File(releaseDirectory, 'compatibility.json'))
def nativeLoaders = new JsonSlurper().parse(file(providers.gradleProperty('nativeManifest').getOrElse('../../native-loaders.json')))
def supportedGames = supportedGames(loader, compatibility, nativeLoaders,
        file(providers.gradleProperty('spigotManifest').getOrElse('../../spigot-servers.json')))
def artifact = new File(releaseDirectory, "raknetify2-${loader}-${compatibility.version}.jar")
def notes = providers.fileContents(layout.projectDirectory.file(providers.gradleProperty('changelogFile').get())).asText
def preview = providers.gradleProperty('publishDryRun').map { it.toBoolean() }.getOrElse(true)

if (!artifact.isFile()) throw new GradleException('Missing verified release artifact: ' + artifact.name)
if (!preview && compatibility.version.contains('dirty')) throw new GradleException('Refusing to publish an uncommitted build')

publishMods {
    file = artifact
    version = compatibility.version + '+' + loader
    displayName = "Raknetify2 ${compatibility.version} (${loader})"
    changelog = notes
    type = compatibility.version.contains('-beta.') ? BETA : ALPHA
    modLoaders.addAll(loader == 'spigot' ? ['spigot', 'paper'] : [loader.split('-mc')[0]])
    dryRun = preview
    // The plugin counts total attempts. One avoids replaying an upload after an uncertain response.
    maxRetries = 1

    if (destination == 'modrinth') {
        modrinth {
            accessToken = providers.environmentVariable('MODRINTH_TOKEN')
            projectId = 'eWU77Xdo'
            minecraftVersions.addAll(supportedGames)
            environment = loader == 'spigot' ? DEDICATED_SERVER_ONLY : CLIENT_AND_SERVER
        }
    }
    if (destination == 'curseforge') {
        curseforge {
            accessToken = providers.environmentVariable('CURSEFORGE_TOKEN')
            projectId = '1785937'
            minecraftVersions.addAll(supportedGames.collect { it == '26.4-snapshot-8' ? '26.4-snapshot' : it })
            javaVersions.addAll(requiredJavaVersions(loader))
            client = true
            server = true
        }
    }
}

/**
 * Selects Java runtime tags for the universal Fabric artifact or a native modern loader.
 * @param loader validated mod distribution whose supported games determine the Java requirements
 * @return Java releases required by the advertised Minecraft versions
 */
static List requiredJavaVersions(String loader) {
    if (loader == 'forge-mc1.20.1') return [JavaVersion.VERSION_17]
    if (loader == 'neoforge-mc1.21.1') return [JavaVersion.VERSION_21]
    return loader == 'fabric'
                    ? [JavaVersion.VERSION_17, JavaVersion.VERSION_21, JavaVersion.VERSION_25]
                    : [JavaVersion.VERSION_25]
}

/**
 * Rejects unknown targets before looking up loader metadata or selecting credential providers.
 * @param loader mod distribution selected for this upload
 * @param destination hosting service selected for this upload
 * @throws GradleException if either selection is outside the supported publication targets
 */
static void validateTarget(String loader, String destination) {
    if (!(loader in ['fabric', 'forge', 'neoforge', 'forge-mc1.20.1', 'neoforge-mc1.21.1', 'spigot'])) throw new GradleException('Unsupported publication loader')
    if (!(destination in ['modrinth', 'curseforge'])) throw new GradleException('Unsupported publication destination')
    if (loader == 'spigot' && destination == 'curseforge') {
        throw new GradleException('Use the publication workflow Bukkit uploader for CurseForge server plugins')
    }
}

/**
 * Reads platform support from the exact source revision that produced the release artifacts.
 * @param loader distribution selected for publication
 * @param compatibility generated universal Fabric compatibility metadata
 * @param nativeLoaders tested Forge and NeoForge version manifest
 * @param spigotManifest tested server version manifest, needed only for plugin publication
 * @return game versions to advertise for this artifact
 */
static List supportedGames(String loader, Map compatibility, Map nativeLoaders, File spigotManifest) {
    if (loader == 'fabric') return compatibility.gameVersions as List
    if (loader == 'spigot') return [new JsonSlurper().parse(spigotManifest).minecraft]
    return [nativeLoaders[loader].minecraft]
}
