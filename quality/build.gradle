/** Builds and runs the source-quality rules against all repository-owned source files. */
plugins {
    id 'java'
    id 'groovy'
    id 'checkstyle'
    id 'codenarc'
    id 'pmd'
}

repositories { mavenCentral() }

configurations { formatter }

dependencies {
    formatter('com.google.googlejavaformat:google-java-format:2.0.0:all-deps') { transitive = false }
    implementation 'com.puppycrawl.tools:checkstyle:14.4.0'
    implementation 'org.codenarc:CodeNarc:4.0.0'
    implementation 'org.apache.groovy:groovy:5.1.3'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.14.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

/** Includes new source files during local development as well as files already committed. */
def ownedSources = providers.exec {
    workingDir projectDir.parentFile
    commandLine 'git', 'ls-files', '--cached', '--others', '--exclude-standard', '-z'
}.standardOutput.asText.get().split('\u0000').findAll { !it.empty }
        .collect { new File(projectDir.parentFile, it) }.findAll { it.isFile() }

/** Maintained transport sources receive the same documentation, complexity, and correctness checks. */
def transportRoot = new File(projectDir.parentFile, 'netty-raknet')
if (!new File(transportRoot, 'settings.gradle').isFile()) {
    throw new GradleException('Initialize the netty-raknet submodule before running source checks.')
}
def transportSources = providers.exec {
    workingDir transportRoot
    commandLine 'git', 'ls-files', '--cached', '--others', '--exclude-standard', '-z'
}.standardOutput.asText.get().split('\u0000').findAll { !it.empty && it.endsWith('.java') }
        .collect { new File(transportRoot, it) }.findAll { it.isFile() }

checkstyle {
    toolVersion = '14.4.0'
    configFile = file('checkstyle.xml')
    ignoreFailures = false
    maxWarnings = 0
}

codenarc {
    toolVersion = '4.0.0'
    configFile = file('codenarc.groovy')
    ignoreFailures = false
    maxPriority1Violations = 0
    maxPriority2Violations = 0
    maxPriority3Violations = 0
}

tasks.withType(Checkstyle).configureEach {
    dependsOn 'classes'
    checkstyleClasspath = configurations.checkstyle + sourceSets.main.output
}

tasks.withType(CodeNarc).configureEach {
    dependsOn 'classes'
    codenarcClasspath = configurations.codenarc + sourceSets.main.output
}

tasks.register('checkJava', Checkstyle) {
    source files(ownedSources.findAll { it.name.endsWith('.java') })
    classpath = files()
    reports { xml.required = true; html.required = true }
}

tasks.register('checkTransportJava', Checkstyle) {
    source files(transportSources)
    classpath = files()
    reports { xml.required = true; html.required = true }
}

tasks.register('checkGroovy', CodeNarc) {
    source files(ownedSources.findAll { it.name.endsWith('.groovy') || it.name.endsWith('.gradle') })
    reports { xml.required = true; html.required = true }
}

test { useJUnitPlatform() }

pmd {
    toolVersion = '7.29.0'
    ruleSets = []
    ruleSetFiles = files('pmd.xml')
    ignoreFailures = false
    consoleOutput = true
}

tasks.withType(Pmd).configureEach {
    classpath = (classpath ?: files()) + files(new File(System.getProperty('java.home'), 'lib/jrt-fs.jar'))
}

tasks.register('checkJavaPractices', Pmd) {
    source files(ownedSources.findAll { it.name.endsWith('.java') })
    classpath = files(new File(System.getProperty('java.home'), 'lib/jrt-fs.jar'))
    reports { xml.required = true; html.required = true }
}

tasks.register('checkTransportJavaPractices', Pmd) {
    source files(transportSources)
    classpath = files(new File(System.getProperty('java.home'), 'lib/jrt-fs.jar'))
    reports { xml.required = true; html.required = true }
}

/** Python command can be overridden when the interpreter has a platform-specific name. */
def pythonCommand = providers.gradleProperty('qualityPython').getOrElse(
        System.getProperty('os.name').toLowerCase().contains('windows') ? 'python' : 'python3')

/** Uses the caller's installed workflow analyzer so local and CI checks share the same rule set. */
def actionlintCommand = providers.gradleProperty('qualityActionlint').getOrElse('actionlint')

tasks.register('checkWorkflows', Exec) {
    workingDir projectDir.parentFile
    commandLine actionlintCommand
}

tasks.register('checkPython', Exec) {
    workingDir projectDir.parentFile
    commandLine pythonCommand, 'quality/check_python.py'
}

tasks.register('checkPythonPractices', Exec) {
    workingDir projectDir.parentFile
    commandLine([pythonCommand, '-m', 'ruff', 'check', '--ignore-noqa', '--config',
            'quality/ruff.toml'] + ownedSources.findAll { it.name.endsWith('.py') }
            .collect { it.absolutePath })
}

tasks.register('testPythonPolicy', Exec) {
    workingDir projectDir.parentFile
    commandLine pythonCommand, '-m', 'unittest', 'discover', '-s', 'quality', '-p', 'test_*.py'
}

/** Uses a JVM argument file so formatting the complete source tree also fits Windows command limits. */
['checkJavaFormat', 'formatJava'].each { taskName ->
    tasks.register(taskName, Exec) {
        workingDir projectDir.parentFile
        doFirst {
            def argumentFile = layout.buildDirectory.file("formatter/${taskName}.args").get().asFile
            argumentFile.parentFile.mkdirs()
            def options = ['-jar', configurations.formatter.singleFile.absolutePath, '--style=aosp']
            options.addAll(taskName == 'formatJava' ? ['--replace'] : ['--dry-run', '--set-exit-if-changed'])
            options.addAll(ownedSources.findAll { it.name.endsWith('.java') }.collect { it.absolutePath })
            argumentFile.setText(options.collect { '"' + it.replace('\\', '/').replace('"', '\\"') + '"' }.join('\n'), 'UTF-8')
            commandLine javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
                    .get().executablePath.asFile.absolutePath, "@${argumentFile.absolutePath}"
        }
    }
}

tasks.named('check') { dependsOn 'checkWorkflows', 'checkJava', 'checkJavaPractices', 'checkTransportJava', 'checkTransportJavaPractices', 'checkJavaFormat', 'checkGroovy', 'checkPython', 'checkPythonPractices', 'testPythonPolicy' }
